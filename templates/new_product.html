{% extends "base.html" %}
{% block title %}새 상품 등록{% endblock %}
{% block container_class %}container narrow{% endblock %}
{% block content %}
<div class="card">
  <h2>상품 등록</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="title">제목</label>
    <input type="text" id="title" name="title" maxlength="100" required>
    <label for="description">설명</label>
    <textarea id="description" name="description" rows="4" maxlength="2000" required></textarea>
    <label for="price">가격 (원)</label>
    <input type="number" id="price" name="price" min="1" max="100000000" required>
    <button type="submit">등록하기</button>
  </form>
</div>
{% endblock %}
